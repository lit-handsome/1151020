
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f4f4f4;
            padding: 50px 20px;
        }

        .profile {
            max-width: 400px;
            margin: auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 12px #ddd;
        }

        img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="me.jpg" alt="我的個人照片">
        <h1>你好，我是你的名字</h1>
        <p>歡迎來到我的個人網站！</p>
        <p>這裡可以介紹自己、分享興趣與生活。</p>
    </div>

</body>
</html>
